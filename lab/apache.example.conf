# Template only: replace names and certificate placeholders before installation.
# Install as dedicated virtual hosts alongside existing host configuration.
<VirtualHost *:443>
    ServerName panel.example.test
    SSLEngine On
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/private-key.pem
    ProxyRequests Off
    ProxyPreserveHost On
    SSLProxyEngine On
    # Only this loopback evaluation endpoint uses a self-signed certificate.
    SSLProxyVerify none
    SSLProxyCheckPeerName off
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Real-IP
    RequestHeader set X-Forwarded-Proto "https"
    ProxyAddHeaders On
    ProxyPass / https://127.0.0.1:18443/ upgrade=websocket connectiontimeout=10 timeout=3600
    ProxyPassReverse / https://127.0.0.1:18443/
</VirtualHost>

